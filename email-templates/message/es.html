<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>{{SUBJECT}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap');
    body, table, td, a {
      font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .body-copy {
      font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    }
    @media only screen and (max-width: 620px) {
      .wrapper { width: 100% !important; }
      .content-pad { padding: 28px 20px !important; }
      .hero-title { font-size: 24px !important; line-height: 1.25 !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#0B1220;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    {{PREHEADER}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#0B1220;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" class="wrapper" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;">

          <tr>
            <td align="center" style="padding:0 0 28px;">
              <img src="https://km0digital.com/brand/logo-icon.png" width="56" height="56" alt="KM0" style="display:block;border:0;border-radius:12px;">
            </td>
          </tr>

          <tr>
            <td style="background-color:#141B28;border:1px solid #2A3344;border-radius:16px;overflow:hidden;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td height="3" style="background-color:#2DD4BF;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td class="content-pad" align="left" style="padding:40px 40px 8px;">
                    <p style="margin:0 0 16px;font-size:11px;font-weight:500;letter-spacing:0.22em;text-transform:uppercase;color:#2DD4BF;">Kilómetro 0 Digital</p>
                    <h1 class="hero-title" style="margin:0;font-size:26px;font-weight:600;line-height:1.25;color:#E6E9ED;letter-spacing:-0.02em;">
                      {{TITLE}}
                    </h1>
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td class="content-pad" style="padding:24px 40px 40px;">
                    <p class="body-copy" style="margin:0;font-size:16px;line-height:1.7;color:rgba(230,233,237,0.78);">
                      {{BODY}}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:28px 16px 0;">
              <p style="margin:0 0 8px;font-size:12px;line-height:1.6;color:rgba(230,233,237,0.45);">
                KM0 Digital · UE · Tus datos no son el producto
              </p>
              <p style="margin:0;font-size:12px;line-height:1.6;">
                <a href="https://km0digital.com" style="color:#2DD4BF;text-decoration:none;">km0digital.com</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>

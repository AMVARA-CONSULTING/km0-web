map $uri $km0_not_found_page {
    ~^/ca/   /ca/404/index.html;
    ~^/en/   /en/404/index.html;
    ~^/de/   /de/404/index.html;
    default  /404.html;
}

map $uri $km0_forbidden_page {
    ~^/ca/   /ca/403/index.html;
    ~^/en/   /en/403/index.html;
    ~^/de/   /de/403/index.html;
    default  /403/index.html;
}

# First language tag only. Browsers and WhatsApp put the preferred language first.
map $http_accept_language $km0_accept {
    default "";
    "~*^ca" ca;
    "~*^de" de;
    "~*^en" en;
    "~*^es" es;
}

# Facebook rescrapes with ?fb_locale=de_DE (and similar) when og:locale:alternate is set.
map $arg_fb_locale $km0_fb {
    default "";
    "~*^ca" ca;
    "~*^de" de;
    "~*^en" en;
    "~*^es" es;
}

# Explicit switcher choice (?km0_locale= and the km0_locale cookie).
map $arg_km0_locale $km0_lock {
    default "";
    "~*^es$" es;
    "~*^ca$" ca;
    "~*^de$" de;
    "~*^en$" en;
}

map $km0_lock $km0_lock_on {
    default 0;
    es 1;
    ca 1;
    de 1;
    en 1;
}

map $km0_lock $km0_set_cookie {
    default "";
    es "km0_locale=es; Path=/; Max-Age=31536000; SameSite=Lax";
    ca "km0_locale=ca; Path=/; Max-Age=31536000; SameSite=Lax";
    de "km0_locale=de; Path=/; Max-Age=31536000; SameSite=Lax";
    en "km0_locale=en; Path=/; Max-Age=31536000; SameSite=Lax";
}

map $cookie_km0_locale $km0_cookie {
    default "";
    "~*^es$" es;
    "~*^ca$" ca;
    "~*^de$" de;
    "~*^en$" en;
}

# Search crawlers must keep seeing Spanish at unprefixed URLs (canonical / x-default).
map $http_user_agent $km0_search {
    default 0;
    "~*(Googlebot|Google-InspectionTool|Bingbot|DuckDuckBot|Applebot|YandexBot|Baiduspider|Slurp|PetalBot)" 1;
}

# Unfurl crawlers. WhatsApp also sends Accept-Language; X/Twitterbot usually does not.
map $http_user_agent $km0_share {
    default 0;
    "~*(Twitterbot|facebookexternalhit|Facebot|WhatsApp|LinkedInBot|Slackbot|Discordbot|TelegramBot|Pinterest|redditbot|Embedly|Iframely)" 1;
}

map $request_method $km0_method_ok {
    default 0;
    GET 1;
    HEAD 1;
}

# 1 = HTML page that is not already under /ca/, /en/, or /de/.
map $uri $km0_unprefixed {
    default 0;
    "~*^/(ca|en|de)(/|$)" 0;
    "~*^/(api|hooks|_astro|fonts|brand)(/|$)" 0;
    "~*\.(css|js|mjs|map|png|jpe?g|gif|ico|svg|webp|woff2?|pdf|txt|xml|json|webmanifest)$" 0;
    "~*^/" 1;
}

# search|share|fb|lock|cookie|accept -> locale to redirect to, or empty to stay.
# First matching regex wins.
map "$km0_search|$km0_share|$km0_fb|$km0_lock|$km0_cookie|$km0_accept" $km0_go {
    default "";
    "~*^1\|" "";
    "~*^0\|[01]\|ca\|" ca;
    "~*^0\|[01]\|de\|" de;
    "~*^0\|[01]\|en\|" en;
    "~*^0\|[01]\|es\|" "";
    "~*^0\|[01]\|[^|]*\|es\|" "";
    "~*^0\|[01]\|[^|]*\|ca\|" ca;
    "~*^0\|[01]\|[^|]*\|de\|" de;
    "~*^0\|[01]\|[^|]*\|en\|" en;
    "~*^0\|0\|[^|]*\|[^|]*\|es\|" "";
    "~*^0\|0\|[^|]*\|[^|]*\|ca\|" ca;
    "~*^0\|0\|[^|]*\|[^|]*\|de\|" de;
    "~*^0\|0\|[^|]*\|[^|]*\|en\|" en;
    "~*^0\|[01]\|[^|]*\|[^|]*\|[^|]*\|ca$" ca;
    "~*^0\|[01]\|[^|]*\|[^|]*\|[^|]*\|de$" de;
    "~*^0\|[01]\|[^|]*\|[^|]*\|[^|]*\|en$" en;
    "~*^0\|[01]\|[^|]*\|[^|]*\|[^|]*\|es$" "";
    "~*^0\|1\|" en;
}

map $km0_go $km0_prefix {
    default "";
    ca "/ca";
    en "/en";
    de "/de";
}

map "$km0_method_ok|$km0_unprefixed|$km0_go" $km0_do {
    default 0;
    "~*^1\|1\|(ca|en|de)$" 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Path-only Location so TLS-terminating host nginx is not bounced to http://.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    error_page 403 $km0_forbidden_page;
    error_page 404 $km0_not_found_page;

    location = /404.html {
        internal;
    }

    location = /403/index.html {
        internal;
    }

    location = /ca/404/index.html {
        internal;
    }

    location = /ca/403/index.html {
        internal;
    }

    location = /en/404/index.html {
        internal;
    }

    location = /en/403/index.html {
        internal;
    }

    location = /de/404/index.html {
        internal;
    }

    location = /de/403/index.html {
        internal;
    }

    location = /cloud {
        return 301 /#cloud-users;
    }

    location = /cloud/ {
        return 301 /#cloud-users;
    }

    location = /ca/cloud {
        return 301 /ca/#cloud-users;
    }

    location = /ca/cloud/ {
        return 301 /ca/#cloud-users;
    }

    location = /en/cloud {
        return 301 /en/#cloud-users;
    }

    location = /en/cloud/ {
        return 301 /en/#cloud-users;
    }

    location = /de/cloud {
        return 301 /de/#cloud-users;
    }

    location = /de/cloud/ {
        return 301 /de/#cloud-users;
    }

    location = /ideas {
        return 301 /;
    }

    location = /ideas/ {
        return 301 /;
    }

    location = /ca/ideas {
        return 301 /ca/;
    }

    location = /ca/ideas/ {
        return 301 /ca/;
    }

    location = /en/ideas {
        return 301 /en/;
    }

    location = /en/ideas/ {
        return 301 /en/;
    }

    location = /de/ideas {
        return 301 /de/;
    }

    location = /de/ideas/ {
        return 301 /de/;
    }

    # public/contact/ is an asset folder (QR PNG); directory GETs must not 403.
    location = /contact {
        return 301 /#contact;
    }

    location = /contact/ {
        return 301 /#contact;
    }

    location = /ca/contact {
        return 301 /ca/#contact;
    }

    location = /ca/contact/ {
        return 301 /ca/#contact;
    }

    location = /en/contact {
        return 301 /en/#contact;
    }

    location = /en/contact/ {
        return 301 /en/#contact;
    }

    location = /de/contact {
        return 301 /de/#contact;
    }

    location = /de/contact/ {
        return 301 /de/#contact;
    }

    # Legacy Apple clients probe the precomposed path; serve the existing icon.
    location = /apple-touch-icon-precomposed.png {
        try_files /apple-touch-icon.png =404;
    }

    location / {
        # Switcher links carry ?km0_locale= so the choice sticks without JavaScript.
        if ($km0_lock_on = 1) {
            return 301 $uri;
        }
        if ($km0_do = 1) {
            return 302 $km0_prefix$uri$is_args$args;
        }
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /hooks/ideas {
        proxy_pass http://host.docker.internal:9181/hooks/ideas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }

    location = /api/visitors {
        proxy_pass http://host.docker.internal:9182/api/visitors;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Vary "Accept-Language, Cookie, User-Agent" always;
    add_header Set-Cookie $km0_set_cookie always;
}
